name: Supagold Scalper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scalper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore cached DB
        uses: actions/cache@v4
        with:
          path: storage/signals.db
          key: scalper-db-${{ github.run_id }}
          restore-keys: scalper-db-
      - name: Run scalper
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scalper.py
      - name: Push DB to journal branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b journal 2>/dev/null || git checkout journal
          git add storage/signals.db
          git commit -m "Update scalper DB" || echo "No changes"
          git push origin journal --force
